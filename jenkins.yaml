pipeline {
    agent {
        kubernetes {
            yaml '''
apiVersion: v1
kind: Pod
spec:
  containers:
  - name: shell
    image: jayagrawaldocker/jenkins:0.4
    command:
    - sleep
    args:
    - infinity
'''
            defaultContainer 'shell'
        }
    }
    stages {
        stage('Main') {
            steps {
                sh 'hostname'
            }
        }
        stage('git call') {
            steps {
                git branch: 'main', url: 'https://github.com/JayAgrawalgit/helm_chart.git'
                sh 'ls -a'
            }
        }
        stage('version cheak') {
            steps {
                sh 'helm version'
                sh 'kubectl version'
            }
        }
        stage('helm install mysql'){
            steps{
                sh 'helm upgrade --install mysql chart5'
            }
        }
        stage('helm install wordpress'){
            steps{
                sh 'helm upgrade --install wordpress chart3'
            }
        }
    }
}
